[package]
default-run = "localization-codegen-example"
name = "localization-codegen-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
bevy_fluent_typed = { path = "../..", features = ["codegen"] }

[build-dependencies]
bevy_fluent_typed = { path = "../..", default-features = false, features = ["build"] }

[package.metadata.localization]
catalog = "assets/localizations/localization.toml"
