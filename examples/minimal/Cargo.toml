[package]
name = "localization-example"
default-run = "localization-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/SDA-31/bevy_fluent_typed"
license = "MIT"
publish = false

[package.metadata.localization]
asset-root = "assets"
catalog = "localizations/localization.toml"

[dependencies]
localization_runtime = { package = "bevy_fluent_typed", path = "../..", features = ["watch", "codegen"] }

[dev-dependencies]
icu_decimal = { version = "2.3", features = ["alloc"] }
icu_locale_core = "2.3"
icu_plurals = "2.3"
icu_provider = { version = "2.3", features = ["sync"] }
fluent-syntax = "0.12"
tempfile = "3"

[build-dependencies]
localization_runtime = { package = "bevy_fluent_typed", path = "../..", default-features = false, features = ["build"] }
