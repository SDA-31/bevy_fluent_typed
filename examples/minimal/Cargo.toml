[package]
name = "localization-example"
default-run = "localization-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/SDA-31/bevy_fluent_typed"
license = "MIT"
publish = false

[[test]]
name = "raw_catalog"
path = "src/tests/raw_root.rs"

[package.metadata.localization]
asset-root = "assets"
catalog = "localizations/localization.toml"

[dependencies]
localization_runtime = { package = "bevy_fluent_typed", path = "../..", default-features = false, features = ["watch", "codegen"] }

[features]
default = ["bevy-0-19"]
bevy-0-17 = ["localization_runtime/bevy-0-17"]
bevy-0-18 = ["localization_runtime/bevy-0-18"]
bevy-0-19 = ["localization_runtime/bevy-0-19"]

[dev-dependencies]
fluent-syntax = "0.12"
tempfile = "3"

[build-dependencies]
localization_bridge = { package = "bevy_fluent_codegen_bridge", path = "../../codegen_bridge", features = ["build"] }
