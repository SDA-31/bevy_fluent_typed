[package]
name = "localization-asset-source-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
bevy_fluent_typed = { path = "../..", features = ["codegen"] }

[build-dependencies]
bevy_fluent_typed = { path = "../..", default-features = false, features = ["build"] }

[package.metadata.localization]
asset-root = "assets"
catalog = "localizations/localization.toml"
