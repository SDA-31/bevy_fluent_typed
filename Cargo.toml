[package]
name = "bevy_fluent_typed"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
description = "Typed Fluent catalog bindings and transactional hot reload for Bevy"
repository = "https://github.com/SDA-31/bevy_fluent_typed"
documentation = "https://docs.rs/bevy_fluent_typed"
readme = "README.md"
keywords = ["bevy", "fluent", "localization", "i18n", "hot-reload"]
categories = ["game-development", "internationalization", "localization"]
license = "MIT"
publish = ["crates-io"]

[package.metadata.docs.rs]
features = ["codegen", "watch", "build", "diagnostics"]

[features]
default = ["bevy-0-20", "manifest"]
bevy-0-16 = ["runtime", "dep:bevy_0_16"]
bevy-0-17 = ["runtime", "dep:bevy_0_17"]
bevy-0-18 = ["runtime", "dep:bevy_0_18"]
bevy-0-19 = ["runtime", "dep:bevy_0_19"]
bevy-0-20 = ["runtime", "dep:bevy_0_20"]
# Enabled by each backend; build-only consumers do not need the runtime.
runtime = ["dep:fluent-typed"]
manifest = ["dep:fluent_typed_codegen", "fluent_typed_codegen/manifest"]
build = ["dep:fluent_typed_codegen", "fluent_typed_codegen/build"]
codegen = ["manifest", "dep:fluent-syntax"]
# Opt-in scope progress and per-leaf diagnostics, without additional dependencies.
diagnostics = []
watch = ["bevy_0_16?/file_watcher", "bevy_0_16?/multi_threaded", "bevy_0_17?/file_watcher", "bevy_0_18?/file_watcher", "bevy_0_19?/file_watcher", "bevy_0_20?/file_watcher"]

[dependencies]
fluent_typed_codegen = { version = "0.2.2", default-features = false, optional = true }
fluent-syntax = { version = "0.12", optional = true }
fluent-typed = { version = "0.9.0", optional = true, default-features = false, features = ["langneg"] }
# Select exactly one backend. Each admits patches within its own Bevy minor.
bevy_0_16 = { package = "bevy", version = "0.16.1", optional = true, default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_text", "bevy_ui", "bevy_sprite"] }
bevy_0_17 = { package = "bevy", version = "0.17.0", optional = true, default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_text", "bevy_ui", "bevy_sprite"] }
bevy_0_18 = { package = "bevy", version = "0.18.0", optional = true, default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_text", "bevy_ui", "bevy_sprite"] }
bevy_0_19 = { package = "bevy", version = "0.19.0", optional = true, default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_text", "bevy_ui", "bevy_sprite"] }
bevy_0_20 = { package = "bevy", version = "0.20.0", optional = true, default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_text", "bevy_ui", "bevy_sprite"] }
