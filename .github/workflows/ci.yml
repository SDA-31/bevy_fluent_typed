name: CI

on:
  push:
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Test a pinned generator checkout, not a game workspace or moving branch.
  GENERATOR_REV: b56a1dcebed32e1cf18c6375647a8cb5960351f6
  # Compile-fail probes inspect rustc diagnostics without ANSI escape sequences.
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

defaults:
  run:
    shell: bash
    working-directory: runtime

jobs:
  quality:
    name: Formatting, Clippy, docs and package inventory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: runtime
          persist-credentials: false
      - name: Check out the pinned generator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SDA-31/fluent_typed_codegen
          ref: ${{ env.GENERATOR_REV }}
          path: generator
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: bevy-quality-${{ runner.os }}-${{ runner.arch }}-${{ env.GENERATOR_REV }}-${{ hashFiles('runtime/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            bevy-quality-${{ runner.os }}-${{ runner.arch }}-${{ env.GENERATOR_REV }}-${{ hashFiles('runtime/**/Cargo.toml') }}-
      - name: Check formatting in every package
        run: |
          for manifest in Cargo.toml examples/minimal/Cargo.toml examples/codegen/Cargo.toml examples/no_codegen/Cargo.toml examples/icu/Cargo.toml examples/asset_source/Cargo.toml tools/compatibility/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
          done
      - name: Resolve independent package graphs
        run: |
          generator_config="patch.crates-io.fluent_typed_codegen.path='$GITHUB_WORKSPACE/generator'"
          for manifest in Cargo.toml examples/minimal/Cargo.toml examples/codegen/Cargo.toml examples/no_codegen/Cargo.toml examples/icu/Cargo.toml examples/asset_source/Cargo.toml tools/compatibility/Cargo.toml; do
            cargo generate-lockfile --manifest-path "$manifest" --config "$generator_config"
          done
      - name: Clippy
        run: |
          generator_config="patch.crates-io.fluent_typed_codegen.path='$GITHUB_WORKSPACE/generator'"
          cargo clippy --locked --all-targets --features codegen,watch --config "$generator_config" -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features build --config "$generator_config" -- -D warnings
          cargo clippy --locked --manifest-path examples/minimal/Cargo.toml --all-targets --config "$generator_config" -- -D warnings
          cargo clippy --locked --manifest-path tools/compatibility/Cargo.toml --all-targets -- -D warnings
          for manifest in examples/codegen/Cargo.toml examples/no_codegen/Cargo.toml examples/icu/Cargo.toml examples/asset_source/Cargo.toml; do
            cargo clippy --locked --manifest-path "$manifest" --all-targets --config "$generator_config" -- -D warnings
          done
      - name: Test build facade and maintainer tool
        run: |
          generator_config="patch.crates-io.fluent_typed_codegen.path='$GITHUB_WORKSPACE/generator'"
          cargo test --locked --no-default-features --features build --config "$generator_config"
          cargo test --locked --manifest-path tools/compatibility/Cargo.toml
      - name: Check minimal runtime dependency isolation
        run: |
          generator_config="patch.crates-io.fluent_typed_codegen.path='$GITHUB_WORKSPACE/generator'"
          cargo tree --locked --no-default-features --features bevy-0-19 --edges normal,build,no-proc-macro --prefix none --config "$generator_config" > "$CARGO_TARGET_DIR/minimal-dependencies.txt"
          if grep -E '^(fluent_typed_codegen|bevy_fluent_codegen_bridge|toml_edit|prettyplease) v' "$CARGO_TARGET_DIR/minimal-dependencies.txt"; then
            echo 'Generator or manifest dependencies leaked into the minimal runtime.' >&2
            exit 1
          fi
      - name: Test custom asset source integration on the default backend
        run: |
          generator_config="patch.crates-io.fluent_typed_codegen.path='$GITHUB_WORKSPACE/generator'"
          cargo test --locked --manifest-path examples/asset_source/Cargo.toml --config "$generator_config"
          cargo run --locked --manifest-path examples/asset_source/Cargo.toml --config "$generator_config"
      - name: Build runtime and build-facade documentation
        run: |
          generator_config="patch.crates-io.fluent_typed_codegen.path='$GITHUB_WORKSPACE/generator'"
          cargo doc --locked --no-deps --features codegen,watch,build --config "$generator_config"
          cargo doc --locked --no-deps --no-default-features --features build --config "$generator_config"
      - name: Inspect library archives without uploading
        run: |
          generator_config="patch.crates-io.fluent_typed_codegen.path='$GITHUB_WORKSPACE/generator'"
          cargo package --locked --list --config "$generator_config" > "$CARGO_TARGET_DIR/runtime-package.txt"
          grep -Fx LICENSE "$CARGO_TARGET_DIR/runtime-package.txt"
          grep -Fx docs/quickstart.md "$CARGO_TARGET_DIR/runtime-package.txt"
          grep -Fx docs/runtime.md "$CARGO_TARGET_DIR/runtime-package.txt"
          grep -Fx docs/asset-sources.md "$CARGO_TARGET_DIR/runtime-package.txt"
          grep -Fx docs/build.md "$CARGO_TARGET_DIR/runtime-package.txt"
          grep -Fx docs/formatting.md "$CARGO_TARGET_DIR/runtime-package.txt"
          # The already-published generator is the runtime's only localization
          # package dependency. No separate bridge release is needed.
          if grep -E '^(examples|tools/compatibility)/' "$CARGO_TARGET_DIR/runtime-package.txt"; then
            echo 'A nested package leaked into the runtime archive.' >&2
            exit 1
          fi

  compatibility:
    name: Bevy ${{ matrix.bevy }} / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            bevy: '0.16.1'
          - os: ubuntu-latest
            rust: stable
            bevy: '0.17.0'
          - os: ubuntu-latest
            rust: stable
            bevy: '0.18.0'
          - os: ubuntu-latest
            rust: stable
            bevy: '0.19.0'
          - os: ubuntu-latest
            rust: '1.95.0'
            bevy: '0.19.0'
          - os: windows-latest
            rust: stable
            bevy: '0.19.0'
          - os: macos-latest
            rust: stable
            bevy: '0.19.0'
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      BEVY_VERSION: ${{ matrix.bevy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: runtime
          persist-credentials: false
      - name: Check out the pinned generator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SDA-31/fluent_typed_codegen
          ref: ${{ env.GENERATOR_REV }}
          path: generator
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version
          cargo --version
      - name: Restore Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: bevy-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ matrix.bevy }}-${{ env.GENERATOR_REV }}-${{ hashFiles('runtime/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            bevy-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ matrix.bevy }}-${{ env.GENERATOR_REV }}-${{ hashFiles('runtime/**/Cargo.toml') }}-
      - name: Resolve the maintainer tool
        run: cargo generate-lockfile --manifest-path tools/compatibility/Cargo.toml
      - name: Verify exact engine release, generated consumers and hot reload
        run: |
          cargo run --locked --manifest-path tools/compatibility/Cargo.toml -- \
            --generator ../generator --target-dir "$CARGO_TARGET_DIR" "$BEVY_VERSION" \
            2>&1 | tee compatibility.log
      - name: Preserve compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.bevy }}
          path: runtime/compatibility.log
          if-no-files-found: ignore
          retention-days: 7
